<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WET Ledger - Accounting System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PDF.js for parsing bank statements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Firebase v9 Compat Libraries for standalone HTML -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Bar chart animations */
        @keyframes growUp { from { height: 0; } }
        @keyframes growRight { from { width: 0; } }
        .animate-grow-up { animation: growUp 0.8s ease-out forwards; }
        .animate-grow-right { animation: growRight 0.8s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // ==========================================
        // 1. FIREBASE CONFIGURATION (Using Compat Mode)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCGGWOgCb9P6x4fgXw0_iAt1h5C6PcZThc",
            authDomain: "wetaccounting.firebaseapp.com",
            projectId: "wetaccounting",
            storageBucket: "wetaccounting.firebasestorage.app",
            messagingSenderId: "644990350065",
            appId: "1:644990350065:web:156e7dd6182fc9ef566f50"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'wet-ledger-final-build';

        const getLedgerRef = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('ledger');

        // --- GLOBAL MASTER CATEGORY LIST ---
        const MAIN_CATEGORIES = [
            "AirBnB", "AirBnB Wrong Acct", "B.com", "Bar Stock", "Bar party", "Bartender", 
            "Cash INCOME", "Cash advance", "Category", "CC", "CC wrong acct", "Charity", 
            "Electric", "Event Expense", "Events", "General", "Hotel Stock", "Ice", 
            "Improvements", "INCOME TO ACCT FOR", "Lazada", "Legal", "Loren", "LOUD", 
            "Maintenance", "Making Change", "Online Sales", "Partner Payment", "Partner Payout", 
            "Party", "PAYMENT TO LOREN", "Pool", "Promotion", "Refund", "Rent", "Repairs", 
            "Restaurant Stock", "Salary", "Staff", "Transfer", "Travel", "Water", "WiFi"
        ].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

        // --- AUTO-CATEGORIZATION DICTIONARY ---
        const AUTO_CAT_RULES = {
            "100854311": "Booking.com",
            "100885284": "Stripe / CC",
            "x379944": "Airbnb",
            "airbnb": "Airbnb",
            "salary": "Payroll",
            "salaries": "Payroll",
            "maintenance": "Maintenance",
            "makro": "Supplies",
            "711": "Food & Beverage",
            "grab": "Transport",
            "ais": "Utilities",
            "pea": "Utilities",
            "provincialelectricity": "Utilities"
        };

        const applyAutoCat = (tx) => {
            const cleanSearchStr = `${tx.desc} ${tx.note || ''} ${tx.chan || ''}`.toLowerCase().replace(/[^a-z0-9]/g, '');
            const rawSearchStr = `${tx.desc} ${tx.note || ''} ${tx.chan || ''}`.toLowerCase();

            for (const [k, v] of Object.entries(AUTO_CAT_RULES)) {
                const cleanKey = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (cleanSearchStr.includes(cleanKey) || rawSearchStr.includes(k.toLowerCase())) {
                    tx.cat = v;
                }
            }
        };

        // --- ROBUST UTILITIES ---
        const parseCurrency = (val) => {
            if (!val) return 0;
            let s = String(val).trim();
            const isNegative = s.startsWith('(') && s.endsWith(')') || s.startsWith('-');
            s = s.replace(/[^0-9.]/g, ''); 
            let n = parseFloat(s);
            if (isNegative) n = -Math.abs(n);
            return isNaN(n) ? 0 : n;
        };

        const normalizeDate = (s) => {
            if (!s || typeof s !== 'string') return new Date(0);
            const parts = s.split(/[\/\s:-]/).filter(Boolean);
            if (parts.length < 3) return new Date(0);
            let d = parseInt(parts[0]), m = parseInt(parts[1]) - 1, y = parseInt(parts[2]);
            if (y > 2400) y -= 543; 
            else if (y < 100) y += 2000;
            const h = parts[3] ? parseInt(parts[3]) : 0;
            const min = parts[4] ? parseInt(parts[4]) : 0;
            return new Date(y, m, d, h, min);
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [ledger, setLedger] = useState([]);
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);
            
            // UI States
            const [searchTerm, setSearchTerm] = useState('');
            const [sort, setSort] = useState({ key: 'date', dir: 'desc' });
            const [statusMsg, setStatusMsg] = useState(null);
            const [selected, setSelected] = useState(new Set());
            const [dbStatus, setDbStatus] = useState('connecting');
            const [activeTab, setActiveTab] = useState('ledger'); 
            
            // Advanced Filters
            const [showFilters, setShowFilters] = useState(false);
            const [filterMonth, setFilterMonth] = useState('');
            const [filterType, setFilterType] = useState('All');
            const [filterMinAmt, setFilterMinAmt] = useState('');
            const [filterMaxAmt, setFilterMaxAmt] = useState('');
            const [catSearchTerm, setCatSearchTerm] = useState('');
            const [excludedCats, setExcludedCats] = useState(new Set());

            // Manager States
            const [showCategoryManager, setShowCategoryManager] = useState(false);
            const [editId, setEditId] = useState(null);
            const [editForm, setEditForm] = useState({});
            const [dialog, setDialog] = useState(null);
            const filterPanelRef = useRef(null);

            const lastBatchId = useMemo(() => localStorage.getItem('wet_last_batch'), [syncing]);

            // PDF.js Worker Configuration
            useEffect(() => {
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                }
            }, []);

            // Firebase Auth
            useEffect(() => {
                let isMounted = true;
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (e) {
                        console.error("Token expired. Re-authenticating anonymously:", e);
                        if (isMounted) setDbStatus('auth-failed');
                    }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (isMounted) setUser(u);
                });
                return () => {
                    isMounted = false;
                    unsubscribe();
                };
            }, []);

            // Firebase Realtime Listener
            useEffect(() => {
                if (!user) return;
                setLoading(true);
                const colRef = getLedgerRef();
                
                const unsub = colRef.onSnapshot((snap) => {
                    const data = [];
                    snap.forEach(doc => data.push({ ...doc.data(), id: doc.id }));
                    setLedger(data);
                    setLoading(false);
                    setDbStatus('connected');
                    setStatusMsg(null);
                }, (err) => {
                    if (err.message.includes('permission') || err.message.includes('Missing or insufficient permissions')) {
                        setDbStatus('blocked');
                        setStatusMsg({ type: 'error', text: `FIREBASE BLOCKED: Go to Firestore Rules and set 'allow read, write: if true;'` });
                    } else {
                        setDbStatus('error');
                        setStatusMsg({ type: 'error', text: `Sync Error: ${err.message}` });
                    }
                    setLoading(false);
                });
                return () => unsub();
            }, [user]);

            // Close filters if clicked outside
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (filterPanelRef.current && !filterPanelRef.current.contains(event.target) && !event.target.closest('.filter-btn')) {
                        setShowFilters(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Global Category Stats 
            const allCategoryStats = useMemo(() => {
                const stats = {};
                ledger.forEach(tx => {
                    const cat = tx.cat || 'General';
                    if (!stats[cat]) stats[cat] = { count: 0 };
                    stats[cat].count += 1;
                });
                return Object.entries(stats).map(([label, data]) => ({label, ...data})).sort((a,b) => b.count - a.count);
            }, [ledger]);

            const allCategories = allCategoryStats.map(c => c.label);

            const toggleCategoryFilter = (cat) => {
                const next = new Set(excludedCats);
                if (next.has(cat)) next.delete(cat);
                else next.add(cat);
                setExcludedCats(next);
            };

            const selectAllCats = () => setExcludedCats(new Set());
            const clearAllCats = () => setExcludedCats(new Set(allCategories));

            // --- THE ULTIMATE ROUTER & PARSER ---
            const processUltimateRaw = async (rawText, batchId) => {
                const lines = rawText.split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length === 0) return;
                const firstLine = lines[0].toLowerCase();
                
                const isStructuredCSV = (firstLine.includes('date') || firstLine.includes('timestamp') || firstLine.includes('column 1')) 
                                        && firstLine.includes(',') 
                                        && !firstLine.includes('account no') 
                                        && !firstLine.includes('account statement') 
                                        && !firstLine.includes('scb');

                const transactionsToSave = [];
                const occurrenceTracker = {}; 

                if (isStructuredCSV) {
                     const headers = firstLine.replace(/^\uFEFF/, '').replace(/"/g, '').split(',').map(h => h.trim());
                     lines.slice(1).forEach(line => {
                         const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                         const row = {};
                         headers.forEach((h, idx) => { row[h] = cols[idx] || ''; });
                         
                         const amtRaw = row['amount'] || row['credit/debit'] || row['total amount'] || row['amount paid'];
                         if (!amtRaw) return;

                         const amt = parseCurrency(amtRaw);
                         let dateStr = row['date'] || row['column 1'] || row['timestamp'] || '';
                         let timeStr = row['time'] || '';
                         
                         if (dateStr.includes(' ')) {
                             timeStr = dateStr.split(' ')[1] || timeStr;
                             dateStr = dateStr.split(' ')[0];
                         }

                         if (dateStr && dateStr.toLowerCase() !== 'date' && dateStr.toLowerCase() !== 'column 1' && dateStr.toLowerCase() !== 'timestamp' && amt !== 0) {
                             let type = String(amtRaw).trim().startsWith('-') ? 'Expense' : 'Income';
                             if (row['amount paid']) type = 'Expense'; 
                             
                             const typeHint = String(row['type'] || row['payment or income?'] || '').toUpperCase();
                             if (typeHint.includes('PAYMENT') || typeHint.includes('EXPENSE') || typeHint.includes('DEBIT')) type = 'Expense';
                             if (typeHint.includes('INCOME') || typeHint.includes('CREDIT')) type = 'Income';
                             
                             const catHint = row['category'] && row['category'].trim() !== '' ? row['category'].trim() : 'General';

                             const tx = {
                                 date: timeStr ? `${dateStr} ${timeStr}` : dateStr,
                                 amt: Math.abs(amt),
                                 type: type,
                                 desc: row['description'] || row['paid for what?'] || '',
                                 note: row['note'] || row['notes'] || '',
                                 cat: catHint,
                                 chan: row['channel'] || row['paid from what money?'] || 'CSV',
                                 batchId,
                                 ts: Date.now()
                             };
                             
                             if (tx.cat === 'General') applyAutoCat(tx);
                             
                             const safeDesc = tx.desc.replace(/[^a-zA-Z0-9]/g, '').substring(0, 15).toLowerCase();
                             const fingerprint = `${tx.date}_${tx.amt}_${tx.type}_${safeDesc}`;
                             occurrenceTracker[fingerprint] = (occurrenceTracker[fingerprint] || 0) + 1;
                             
                             tx.id = `tx_${tx.date.replace(/[^0-9]/g, '')}_${tx.amt}_${occurrenceTracker[fingerprint]}`;
                             transactionsToSave.push(tx);
                         }
                     });
                } else {
                    let clean = rawText;

                    clean = clean.replace(/["|]/g, ' ');
                    clean = clean.replace(/,(?!\d)/g, ' '); 
                    clean = clean.replace(/[\r\n]+/g, ' ');

                    for (let i = 0; i < 3; i++) {
                        clean = clean.replace(/\b(\d+)\s+(\d{3}(?:\.\d{1,2})?\b)/g, '$1$2');
                    }

                    let lastBalance = null;
                    const bfMatch = clean.replace(/,/g, '').match(/(?:brought forward|ยอดยกมา|ยกมา)[^0-9]*?([\d.]+)/i);
                    if (bfMatch) lastBalance = parseFloat(bfMatch[1]);

                    const garbageList = [
                        /TOTAL AMOUNTS \(Debit\)[\s\d.,]+TOTAL AMOUNTS \(Credit\)[\s\d.,]+TOTAL ITEMS[\s\d]+/gi,
                        /\d{2}:\d{2}:\d{2}(?:\s*น\.)?(?:\s*\d{2}:\d{2}:\d{2}\.?)?/gi,
                        /(?:หน้า|หนา)?\s*สาขา\s*เลขที่บัญชี\s*วันที่\s*Date\s*[\d-]+\s*CENTRALFESTIVAL SAMUI/gi,
                        /Date\s*วันที่\s*Time\s*Code\s*Channel\s*Description\/?\s*Balance\/Baht\s*Debit\/Credit/gi,
                        /เวลา\s*รายการ\s*(?:ช่องทาง|ของทาง)\s*ลูกหนี้\/เจ้าหนี้\s*ยอดเงินคงเหลือ\s*รายละเอ(?:ียด\/บันทึกช่วยจำ)?/gi,
                        /This document is auto-generated[\s\S]*?(?=(?:\d{2}\/\d{2}\/(?:\d{4}|\d{2})[\s,]*)?\d{2}:\d{2}\b|$)/gi,
                        /เอกสารฉบับนี้ออกโดยระบบอัตโนมัติ[\s\S]*?(?=(?:\d{2}\/\d{2}\/(?:\d{4}|\d{2})[\s,]*)?\d{2}:\d{2}\b|$)/gi,
                        /SCB Call Center.*?02\s*777\s*7777/gi,
                        /ACCOUNT STATEMENT WITH NOTES/gi,
                        /STATEMENT OF SAVING ACCOUNT/gi,
                        /รายการเดินบัญชี\s*พร้อมบันทึกช่วยจํา/gi,
                        /ใบแจ้งรายการบัญชีออมทรัพย์/gi,
                        /Account No\.\/Account Type\s*Statement Period\s*Page/gi,
                        /Account No\./gi,
                        /เลขที่บัญชี\/ประเภทบัญชี\s*วันที่\s*หน้า/gi,
                        /เลขที่บัญชี\s*[\d-]+/gi,
                        /MISTER LOREN DOUGLAS(?:\s*INFELD)?\s*(?:439-093321-8)?/gi,
                        /INFELD Savings/gi,
                        /Savings INFELD/gi,
                        /THE SIAM COMMERCIAL BANK PUBLIC COMPANY LIMITED/gi,
                        /ธนาคารไทยพาณิชย์ จำกัด \(มหาชน\)/gi,
                        /สาขา CENTRALFESTIVAL SAMUI/gi,
                        /ชื่อ - สกุล\s*Name/gi,
                        /ที่อยู่\s*Address/gi,
                        /28\/12 ม\.3 ต\.แม่น้ำ อ\.เกาะสมุย จ\.สุราษฎร์ธานี 84330/gi,
                        /SCB\s*ไทยพาณิชย์/gi,
                        /\d{2}\/\d{2}\/\d{4}\s*-\s*\d{2}\/\d{2}\/\d{4}/g,
                        /Date\/Time\s*Code\/Channel\s*Debit\s*Credit\s*Balance\s*Description\/Note/gi,
                        /Date\s*Time\s*Channel\s*Code\s*Debit\/Credit\s*Balance\/Baht\s*Description\/Note/gi,
                        /วันที่\/เวลา\s*รายการ\/ช่องทาง\s*ลูกหนี้\s*เจ้าหนี้\s*ยอดเงินคงเหลือ\s*รายละเอียด\/บันทึกช่วยจำ/gi,
                        /วันที่\s*เวลา\s*รายการ\s*(?:ช่องทาง|ของทาง)\s*ลูกหนี้\/เจ้าหนี้\s*ยอดเงินคงเหลือ\s*รายละเอียด\/บันทึกช่วยจำ/gi,
                        /วันที่\/เวลา.*?บันทึกช่วยจำ/gi,
                        /www\.scb\.co\.th/gi,
                        /\bDESC\s*:/gi,
                        /\bNOTE\s*:/gi,
                        /\bDESC\b/gi,
                        /\bNOTE\b/gi,
                        /Page\s*\d+\s*\/\s*\d+/gi,
                        /หนา\s*\d+\/\d+/gi,
                        /หน้า\s*\d+\/\d+/gi,
                        /(?:\s\b\d+\s*\/\s*\d+\b\s)/g,
                        /ยอดเงินคงเหลือยกมา\s*\(Balance brought forward\)\s*\*{0,3}\s*[\d,.]+/gi,
                        /ยกมา\s*\(BALANCE BROUGHT FORWARD\)\s*[\d,.]+/gi
                    ];
                    
                    garbageList.forEach(g => { clean = clean.replace(g, ' '); });
                    clean = clean.replace(/\s+/g, ' ').trim();

                    const amtExp = "-?\\d[\\d,]*\\.\\d{1,2}";
                    const chanExp = "[A-Za-z0-9]{2,4}(?:[\\/\\s][A-Za-z0-9]{2,6})?";
                    const txAnchor = `(?:(?:\\d{2}/\\d{2}/(?:\\d{4}|\\d{2}))[\\s,]*)?\\d{2}:\\d{2}[\\s,]+${chanExp}[\\s,]+${amtExp}`;
                    const txRegex = new RegExp(`(?:(\\d{2}/\\d{2}/(?:\\d{4}|\\d{2}))[\\s,]*)?(\\d{2}:\\d{2})[\\s,]+([A-Za-z0-9/\\s-]{2,20}?)[\\s,]+(${amtExp})[\\s,]*(?:(${amtExp})[\\s,]*)?(.*?)(?=${txAnchor}|$)`, 'gi');
                    
                    let match;
                    let lastDate = "01/01/25"; 
                    
                    while ((match = txRegex.exec(clean)) !== null) {
                        if (match[1]) lastDate = match[1];
                        
                        const time = match[2];
                        const chan = match[3];
                        const amtRaw = parseCurrency(match[4]);
                        const balRaw = match[5] ? parseCurrency(match[5]) : null;
                        
                        let desc = match[6].trim();
                        
                        if (match[4] && desc.startsWith(match[4])) desc = desc.substring(match[4].length).trim();
                        if (match[5] && desc.startsWith(match[5])) desc = desc.substring(match[5].length).trim();
                        desc = desc.replace(/^[-|:,]+/, '').replace(/[-|:,]+$/, '').trim();

                        let type = 'Expense';
                        if (amtRaw < 0) {
                            type = 'Expense';
                        } else if (lastBalance !== null && balRaw !== null) {
                            const diff = balRaw - lastBalance;
                            if (Math.abs(diff - Math.abs(amtRaw)) < 0.1) type = 'Income';
                            else if (Math.abs(diff + Math.abs(amtRaw)) < 0.1) type = 'Expense';
                            else type = balRaw > lastBalance ? 'Income' : 'Expense';
                        } else {
                            if (/deposit|income|c1\/|refund|promptpay/i.test(chan + ' ' + desc)) {
                                type = 'Income';
                            }
                        }
                        if (balRaw !== null) lastBalance = balRaw;

                        const tx = {
                            date: `${lastDate} ${time}`,
                            amt: Math.abs(amtRaw),
                            type,
                            desc: desc.substring(0, 300),
                            note: '', 
                            chan: chan.trim(),
                            cat: 'General',
                            batchId,
                            ts: Date.now()
                        };

                        applyAutoCat(tx);
                        
                        const safeDesc = tx.desc.replace(/[^a-zA-Z0-9]/g, '').substring(0, 15).toLowerCase();
                        const fingerprint = `${tx.date}_${tx.amt}_${tx.type}_${safeDesc}`;
                        occurrenceTracker[fingerprint] = (occurrenceTracker[fingerprint] || 0) + 1;
                        
                        tx.id = `tx_${lastDate.replace(/[^0-9]/g, '')}_${time.replace(':','')}__${tx.amt}_${occurrenceTracker[fingerprint]}`;
                        transactionsToSave.push(tx);
                    }
                }

                let savedCount = 0;
                const CHUNK_SIZE = 200;
                const colRef = getLedgerRef();

                for (let i = 0; i < transactionsToSave.length; i += CHUNK_SIZE) {
                    const batch = db.batch();
                    transactionsToSave.slice(i, i + CHUNK_SIZE).forEach(entry => {
                        batch.set(colRef.doc(entry.id), entry);
                        savedCount++;
                    });
                    await batch.commit();
                }

                localStorage.setItem('wet_last_batch', batchId);
                setSyncing(false);
                setStatusMsg({ type: 'success', text: `Perfectly extracted ${savedCount} records.` });
                setTimeout(() => setStatusMsg(null), 8000);
            };

            const handleImport = async (e) => {
                const file = e.target.files[0];
                if (!file || !user) return;
                if (dbStatus === 'blocked') {
                    setStatusMsg({ type: 'error', text: `Cannot import: Firebase Database is blocked by Security Rules.` });
                    e.target.value = null;
                    return;
                }

                setSyncing(true);
                const batchId = `import_${Date.now()}`;
                setStatusMsg({ type: 'info', text: "Analyzing file structure..." });

                try {
                    let fullText = '';
                    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        if (!window.pdfjsLib) throw new Error("PDF Library is still loading. Please try again.");
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
                        
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            fullText += content.items.map(item => item.str).join(' ') + ' ';
                        }
                    } else {
                        fullText = await new Promise((resolve, reject) => {
                            const r = new FileReader();
                            r.onload = evt => resolve(evt.target.result);
                            r.onerror = e => reject(e);
                            r.readAsText(file);
                        });
                    }
                    await processUltimateRaw(fullText, batchId);
                } catch (err) {
                    setSyncing(false);
                    setStatusMsg({ type: 'error', text: `Import failed: ${err.message}` });
                }
                e.target.value = null;
            };

            // --- MANAGEMENT TOOLS ---
            const applyRulesToExisting = () => {
                if (dbStatus === 'blocked') return setStatusMsg({ type: 'error', text: "Database blocked." });
                if (ledger.length === 0) {
                    setStatusMsg({ type: 'error', text: "Database is empty. Nothing to tag." });
                    setTimeout(() => setStatusMsg(null), 3000);
                    return;
                }
                setDialog({
                    title: "Auto-Tag Records",
                    message: "Scan the entire database and auto-apply categorization rules to all existing entries?",
                    confirmText: "Auto-Tag Now",
                    onConfirm: async () => {
                        setSyncing(true);
                        setStatusMsg({ type: 'info', text: "Applying smart rules to database..." });
                        try {
                            let updates = 0;
                            const CHUNK = 400;
                            const colRef = getLedgerRef();
                            for (let i = 0; i < ledger.length; i += CHUNK) {
                                const batch = db.batch();
                                const chunk = ledger.slice(i, i + CHUNK);
                                
                                chunk.forEach(item => {
                                    const originalCat = item.cat;
                                    applyAutoCat(item);
                                    if (originalCat !== item.cat) {
                                        batch.set(colRef.doc(item.id), { cat: item.cat }, { merge: true });
                                        updates++;
                                    }
                                });
                                await batch.commit();
                            }
                            setStatusMsg({ type: 'success', text: `Auto-categorized ${updates} records.` });
                        } catch (err) {
                            setStatusMsg({ type: 'error', text: `Failed: ${err.message}` });
                        }
                        setSyncing(false);
                        setTimeout(() => setStatusMsg(null), 4000);
                    }
                });
            };

            const bulkCategorize = () => {
                if (dbStatus === 'blocked') return setStatusMsg({ type: 'error', text: "Database blocked." });
                setDialog({
                    type: 'prompt',
                    list: 'main-categories',
                    title: "Bulk Categorize",
                    message: `Assign a new category to the ${selected.size} selected rows:`,
                    confirmText: "Save Category",
                    onConfirm: async (cat) => {
                        if (!cat || !cat.trim()) return;
                        setSyncing(true);
                        try {
                            const CHUNK = 400;
                            const ids = Array.from(selected);
                            const colRef = getLedgerRef();
                            for (let i = 0; i < ids.length; i += CHUNK) {
                                const batch = db.batch();
                                ids.slice(i, i + CHUNK).forEach(id => {
                                    batch.set(colRef.doc(id), { cat: cat.trim() }, { merge: true });
                                });
                                await batch.commit();
                            }
                            setSelected(new Set());
                            setStatusMsg({ type: 'success', text: "Categories updated." });
                        } catch (err) {
                            setStatusMsg({ type: 'error', text: `Update failed: ${err.message}` });
                        }
                        setSyncing(false);
                        setTimeout(() => setStatusMsg(null), 4000);
                    }
                });
            };

            const triggerDelete = (ids) => {
                if (dbStatus === 'blocked') return setStatusMsg({ type: 'error', text: "Database blocked." });
                if (!ids || ids.length === 0) {
                    setStatusMsg({ type: 'error', text: "No items available to delete." });
                    setTimeout(() => setStatusMsg(null), 3000);
                    return;
                }
                setDialog({
                    title: "Confirm Deletion",
                    message: `Are you sure you want to permanently wipe ${ids.length} records? This action cannot be undone.`,
                    danger: true,
                    confirmText: "Yes, Delete",
                    onConfirm: async () => {
                        setSyncing(true);
                        const CHUNK = 400;
                        const colRef = getLedgerRef();
                        try {
                            for (let i = 0; i < ids.length; i += CHUNK) {
                                const batch = db.batch();
                                ids.slice(i, i + CHUNK).forEach(id => {
                                    batch.delete(colRef.doc(id));
                                });
                                await batch.commit();
                            }
                            setSelected(new Set());
                            setStatusMsg({ type: 'success', text: "Database records removed." });
                        } catch (e) {
                            setStatusMsg({ type: 'error', text: `Delete failed: ${e.message}` });
                        }
                        setSyncing(false);
                        setTimeout(() => setStatusMsg(null), 3000);
                    }
                });
            };

            const undoLastImport = () => {
                const lastId = localStorage.getItem('wet_last_batch');
                if (!lastId) {
                    setStatusMsg({ type: 'error', text: "No previous import found to undo." });
                    setTimeout(() => setStatusMsg(null), 3000);
                    return;
                }
                const toDelete = ledger.filter(i => i.batchId === lastId).map(i => i.id);
                if (toDelete.length > 0) {
                    triggerDelete(toDelete);
                    localStorage.removeItem('wet_last_batch');
                } else {
                    setStatusMsg({ type: 'error', text: "No records found from the last import." });
                    setTimeout(() => setStatusMsg(null), 3000);
                }
            };

            const removeDuplicates = () => {
                if (dbStatus === 'blocked') return setStatusMsg({ type: 'error', text: "Database blocked." });
                setDialog({
                    title: "Remove Duplicates",
                    message: "Scan database and remove exact duplicate transactions? (Note: Overlapping imports are now securely overwritten by default)",
                    confirmText: "Scan & Remove",
                    onConfirm: async () => {
                        setSyncing(true);
                        setStatusMsg({ type: 'info', text: "Scanning for duplicates..." });

                        const seen = new Set();
                        const duplicates = [];
                        const sortedLedger = [...ledger].sort((a, b) => a.ts - b.ts);

                        sortedLedger.forEach(tx => {
                            const fingerprint = `${tx.date}_${tx.amt}_${tx.type}_${tx.desc}`;
                            if (seen.has(fingerprint)) {
                                duplicates.push(tx.id);
                            } else {
                                seen.add(fingerprint);
                            }
                        });

                        if (duplicates.length === 0) {
                            setSyncing(false);
                            setStatusMsg({ type: 'success', text: "No duplicates found." });
                            setTimeout(() => setStatusMsg(null), 3000);
                            return;
                        }

                        try {
                            const CHUNK = 400;
                            const colRef = getLedgerRef();
                            for (let i = 0; i < duplicates.length; i += CHUNK) {
                                const batch = db.batch();
                                duplicates.slice(i, i + CHUNK).forEach(id => {
                                    batch.delete(colRef.doc(id));
                                });
                                await batch.commit();
                            }
                            setStatusMsg({ type: 'success', text: `Removed ${duplicates.length} duplicate records.` });
                        } catch (err) {
                            setStatusMsg({ type: 'error', text: `Failed to remove duplicates: ${err.message}` });
                        }
                        setSyncing(false);
                        setTimeout(() => setStatusMsg(null), 4000);
                    }
                });
            };

            // --- ADVANCED DATA FILTERING ---
            const filtered = useMemo(() => {
                let list = ledger.filter(i => {
                    // 1. Category Exclusions
                    if (excludedCats.has(i.cat || 'General')) return false;

                    // 2. Month Filter
                    if (filterMonth) {
                        const d = normalizeDate(i.date);
                        if (d.getFullYear() !== 1970) {
                            const mo = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}`;
                            if (mo !== filterMonth) return false;
                        }
                    }

                    // 3. Type Filter
                    if (filterType !== 'All' && i.type !== filterType) return false;

                    // 4. Amount Limits
                    const amt = i.amt || 0;
                    if (filterMinAmt !== '' && amt < parseFloat(filterMinAmt)) return false;
                    if (filterMaxAmt !== '' && amt > parseFloat(filterMaxAmt)) return false;

                    // 5. Text Search
                    if (searchTerm) {
                        const s = searchTerm.toLowerCase();
                        return (i.desc && i.desc.toLowerCase().includes(s)) || 
                               (i.cat && i.cat.toLowerCase().includes(s)) || 
                               (i.date && i.date.includes(s));
                    }
                    return true;
                });

                return list.sort((a, b) => {
                    const f = sort.dir === 'asc' ? 1 : -1;
                    if (sort.key === 'date') return (normalizeDate(a.date) - normalizeDate(b.date)) * f;
                    if (sort.key === 'cat') return (a.cat || 'General').localeCompare(b.cat || 'General') * f;
                    return ((a[sort.key] || 0) > (b[sort.key] || 0) ? 1 : -1) * f;
                });
            }, [ledger, searchTerm, sort, excludedCats, filterMonth, filterType, filterMinAmt, filterMaxAmt]);

            const totals = useMemo(() => filtered.reduce((acc, i) => {
                const amount = i.amt || 0;
                if (i.type === 'Income') acc.inc += amount; else acc.exp += amount;
                return acc;
            }, { inc: 0, exp: 0 }), [filtered]);

            // --- REPORTS LOGIC & CHARTS ---
            const reportStats = useMemo(() => {
                const monthly = {};
                const categories = {};
                
                filtered.forEach(tx => {
                    const d = normalizeDate(tx.date);
                    if (d.getFullYear() === 1970) return; 
                    
                    const mo = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}`;
                    const cat = tx.cat || 'General';
                    
                    if(!monthly[mo]) monthly[mo] = { label: mo, inc: 0, exp: 0 };
                    if(!categories[cat]) categories[cat] = { inc: 0, exp: 0 };
                    
                    const amount = tx.amt || 0;
                    if (tx.type === 'Income') {
                        monthly[mo].inc += amount;
                        categories[cat].inc += amount;
                    } else {
                        monthly[mo].exp += amount;
                        categories[cat].exp += amount;
                    }
                });

                const sortedMonthly = Object.values(monthly).sort((a,b) => a.label.localeCompare(b.label)); // Chronological for chart
                const maxMonthVal = sortedMonthly.length > 0 ? Math.max(...sortedMonthly.flatMap(m => [m.inc, m.exp])) : 1;

                const sortedCats = Object.entries(categories).map(([label, data]) => ({label, ...data})).sort((a,b) => b.exp - a.exp);
                const maxCatExp = sortedCats.length > 0 ? Math.max(...sortedCats.map(c => c.exp)) : 1;

                return {
                    monthly: sortedMonthly,
                    maxMonthVal,
                    categories: sortedCats,
                    maxCatExp
                };
            }, [filtered]);

            if (loading && !user) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-slate-50 text-slate-900">
                        <i className="ph ph-spinner animate-spin text-blue-600 mb-4 text-4xl"></i>
                        <p className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Connecting Database...</p>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-[#fdfdfd] text-xs font-sans text-slate-900 overflow-hidden relative">
                    
                    <datalist id="main-categories">
                        {MAIN_CATEGORIES.map(cat => <option key={cat} value={cat} />)}
                    </datalist>

                    {/* ULTRA DENSE HEADER */}
                    <header className="bg-white border-b flex flex-col md:flex-row items-center justify-between px-4 py-2 md:h-14 shrink-0 z-30 shadow-sm gap-2">
                        
                        {/* 1. Logo (Left) */}
                        <div className="flex items-center gap-2 w-full md:w-[200px]">
                            <div className="bg-slate-900 text-white p-1.5 rounded-lg shadow-sm">
                                <i className="ph ph-database text-lg"></i>
                            </div>
                            <div className="leading-none">
                                <div className="font-black text-slate-900 text-base tracking-tight">WET<span className="text-blue-600">LEDGER</span></div>
                                <div className="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Density Build</div>
                            </div>
                        </div>

                        {/* 2. Tools & Search (Center) */}
                        <div className="flex flex-1 flex-wrap items-center justify-center gap-1.5 w-full">
                            {activeTab === 'ledger' && (
                                <>
                                    <div className="relative w-full max-w-[200px]">
                                        <i className="ph ph-magnifying-glass absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                        <input 
                                            className="pl-7 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-md w-full outline-none focus:ring-1 focus:ring-blue-500 focus:bg-white transition-all shadow-inner font-medium text-[11px]" 
                                            placeholder="Search ledger..." 
                                            value={searchTerm} 
                                            onChange={e => setSearchTerm(e.target.value)} 
                                        />
                                    </div>

                                    {/* Advanced Filter Button */}
                                    <div className="relative" ref={filterPanelRef}>
                                        <button 
                                            onClick={() => setShowFilters(!showFilters)} 
                                            className={`px-2.5 py-1.5 border rounded-md flex items-center gap-1 text-[10px] font-bold transition-all filter-btn ${showFilters || excludedCats.size > 0 || filterMonth || filterType !== 'All' ? 'bg-blue-50 border-blue-200 text-blue-600 shadow-inner' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                            title="Advanced Filters"
                                        >
                                            <i className="ph ph-funnel text-sm"></i> Filters
                                            {(excludedCats.size > 0 || filterMonth || filterType !== 'All') && <span className="bg-blue-600 text-white text-[8px] px-1 rounded-full">!</span>}
                                        </button>

                                        {/* Filter Dropdown Panel */}
                                        {showFilters && (
                                            <div className="absolute top-full left-0 md:left-1/2 md:-translate-x-1/2 mt-2 w-[320px] bg-white border border-slate-200 shadow-2xl rounded-xl p-4 z-50 animate-in slide-in-from-top-2">
                                                <div className="grid grid-cols-2 gap-3 mb-3 pb-3 border-b border-slate-100">
                                                    <div>
                                                        <label className="block text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Month</label>
                                                        <input type="month" value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1 text-xs outline-none focus:border-blue-400"/>
                                                    </div>
                                                    <div>
                                                        <label className="block text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Type</label>
                                                        <select value={filterType} onChange={e => setFilterType(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1 text-xs outline-none focus:border-blue-400">
                                                            <option value="All">All Transactions</option>
                                                            <option value="Income">Income Only</option>
                                                            <option value="Expense">Expense Only</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Min ฿</label>
                                                        <input type="number" placeholder="0" value={filterMinAmt} onChange={e => setFilterMinAmt(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1 text-xs outline-none focus:border-blue-400"/>
                                                    </div>
                                                    <div>
                                                        <label className="block text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">Max ฿</label>
                                                        <input type="number" placeholder="Any" value={filterMaxAmt} onChange={e => setFilterMaxAmt(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1 text-xs outline-none focus:border-blue-400"/>
                                                    </div>
                                                </div>

                                                <div className="flex justify-between items-end mb-2">
                                                    <label className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Categories</label>
                                                    <div className="text-[9px] font-bold">
                                                        <button onClick={selectAllCats} className="text-blue-600 hover:underline">All</button>
                                                        <span className="text-slate-300 mx-1">|</span>
                                                        <button onClick={clearAllCats} className="text-blue-600 hover:underline">None</button>
                                                    </div>
                                                </div>
                                                <input 
                                                    type="text" placeholder="Search categories to filter..." 
                                                    value={catSearchTerm} onChange={e => setCatSearchTerm(e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 text-xs mb-2 outline-none focus:border-blue-400"
                                                />
                                                <div className="max-h-40 overflow-y-auto border border-slate-100 rounded-md bg-slate-50/50 p-1">
                                                    {allCategories.filter(c => c.toLowerCase().includes(catSearchTerm.toLowerCase())).map(cat => (
                                                        <label key={cat} className="flex items-center gap-2 p-1.5 hover:bg-slate-100 rounded cursor-pointer">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={!excludedCats.has(cat)} 
                                                                onChange={() => toggleCategoryFilter(cat)}
                                                                className="accent-blue-600 rounded"
                                                            />
                                                            <span className="text-xs font-medium text-slate-700 truncate">{cat}</span>
                                                        </label>
                                                    ))}
                                                    {allCategories.length === 0 && <div className="text-[10px] text-slate-400 p-2 text-center">No categories found.</div>}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <button onClick={() => setShowCategoryManager(true)} className="px-2 py-1.5 border rounded-md flex items-center gap-1 bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100 text-[10px] font-bold" title="Manage Categories"><i className="ph ph-folders text-sm"></i> Cats</button>
                                    
                                    <label className="bg-blue-600 text-white px-2.5 py-1.5 rounded-md font-bold cursor-pointer hover:bg-blue-700 transition-all flex items-center gap-1 text-[10px] shadow-sm ml-1">
                                        <i className="ph ph-upload-simple"></i> Upload
                                        <input type="file" accept=".csv, .pdf, text/csv, application/pdf" className="hidden" onChange={handleImport} />
                                    </label>
                                </>
                            )}
                        </div>

                        {/* 3. Tabs (Right) */}
                        <div className="flex items-center justify-end w-full md:w-[200px]">
                            <div className="flex bg-slate-100 p-0.5 rounded-lg shadow-inner">
                                <button onClick={() => setActiveTab('ledger')} className={`px-3 py-1 rounded-md text-[9px] font-black uppercase tracking-wider transition-all flex items-center gap-1 ${activeTab === 'ledger' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <i className="ph ph-table"></i> Ledger
                                </button>
                                <button onClick={() => setActiveTab('reports')} className={`px-3 py-1 rounded-md text-[9px] font-black uppercase tracking-wider transition-all flex items-center gap-1 ${activeTab === 'reports' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <i className="ph ph-chart-line-up"></i> Reports
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Status Alerts */}
                    {statusMsg && (
                        <div className={`absolute top-16 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2 rounded-lg text-[10px] font-bold shadow-xl animate-in fade-in slide-in-from-top-2 duration-300 ${statusMsg.type === 'error' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`}>
                            {statusMsg.type === 'error' ? <i className="ph ph-warning text-sm"></i> : <i className="ph ph-check-circle text-sm"></i>}
                            {statusMsg.text}
                        </div>
                    )}

                    {/* Banner: Ultra-Dense */}
                    <div className="grid grid-cols-2 md:grid-cols-4 border-b bg-white divide-x divide-y md:divide-y-0 divide-slate-100 shrink-0 z-10 shadow-sm">
                        <div className="p-2 md:p-3 bg-emerald-50/20">
                            <div className="flex items-center gap-1 mb-0.5">
                                <div className="text-emerald-600"><i className="ph ph-arrow-up-right text-xs"></i></div>
                                <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">Income</p>
                            </div>
                            <p className="text-lg md:text-xl font-black text-emerald-600 tracking-tight">฿{totals.inc.toLocaleString(undefined, {minimumFractionDigits:2})}</p>
                        </div>
                        
                        <div className="p-2 md:p-3 bg-rose-50/20">
                            <div className="flex items-center gap-1 mb-0.5">
                                <div className="text-rose-600"><i className="ph ph-arrow-down-left text-xs"></i></div>
                                <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">Expense</p>
                            </div>
                            <p className="text-lg md:text-xl font-black text-rose-600 tracking-tight">฿{totals.exp.toLocaleString(undefined, {minimumFractionDigits:2})}</p>
                        </div>

                        <div className="p-2 md:p-3 bg-blue-50/20">
                            <div className="flex items-center gap-1 mb-0.5">
                                <div className="text-blue-600"><i className="ph ph-wallet text-xs"></i></div>
                                <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">Net</p>
                            </div>
                            <p className={`text-lg md:text-xl font-black tracking-tight ${totals.inc - totals.exp >= 0 ? 'text-blue-700' : 'text-orange-600'}`}>฿{(totals.inc - totals.exp).toLocaleString(undefined, {minimumFractionDigits:2})}</p>
                        </div>

                        <div className="p-2 md:p-3 flex flex-col justify-center items-end bg-slate-50/50">
                            <div className="flex flex-wrap justify-end gap-1.5 w-full">
                                {selected.size > 0 && activeTab === 'ledger' ? (
                                    <>
                                        <button onClick={bulkCategorize} className="flex-1 bg-slate-900 text-white rounded-md font-black uppercase text-[9px] py-1 shadow-sm hover:bg-black flex items-center justify-center gap-1"><i className="ph ph-tag"></i> Tag</button>
                                        <button onClick={() => triggerDelete(Array.from(selected))} className="flex-1 bg-red-600 text-white rounded-md font-black uppercase text-[9px] py-1 shadow-sm hover:bg-red-700 flex items-center justify-center gap-1"><i className="ph ph-trash"></i> Del</button>
                                    </>
                                ) : (
                                    <>
                                        {activeTab === 'ledger' && (
                                            <>
                                                <button onClick={removeDuplicates} className="flex-1 bg-amber-100 text-amber-700 px-2 py-1 rounded-md font-black uppercase text-[9px] flex items-center justify-center gap-1 hover:bg-amber-200" title="Deduplicate"><i className="ph ph-copy"></i> Dedup</button>
                                                <button onClick={applyRulesToExisting} className="flex-1 bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md font-black uppercase text-[9px] flex items-center justify-center gap-1 hover:bg-indigo-200" title="Auto-Tag"><i className="ph ph-magic-wand"></i> Auto-Tag</button>
                                            </>
                                        )}
                                        {activeTab === 'ledger' && <button onClick={() => triggerDelete(ledger.map(i => i.id))} className="bg-red-100 text-red-600 px-2 py-1 rounded-md font-black uppercase text-[9px] flex items-center justify-center hover:bg-red-200" title="Wipe Database"><i className="ph ph-eraser"></i></button>}
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 overflow-y-auto overflow-x-hidden bg-white relative">
                        
                        {/* TAB: LEDGER (Ultra-Dense) */}
                        {activeTab === 'ledger' && (
                            <div className="w-full overflow-x-auto block">
                                <table className="w-full min-w-[800px] text-left border-collapse table-fixed">
                                    <thead className="sticky top-0 bg-slate-100 z-20 border-b border-slate-200 shadow-sm">
                                        <tr className="text-slate-500 font-black uppercase text-[9px] tracking-widest">
                                            <th className="px-2 py-1.5 w-10 text-center border-r border-slate-200">
                                                <button onClick={() => {
                                                    if (selected.size === filtered.length && filtered.length > 0) setSelected(new Set());
                                                    else setSelected(new Set(filtered.map(i => i.id)));
                                                }}>
                                                    {selected.size > 0 && selected.size === filtered.length ? <i className="ph ph-check-square text-base text-blue-600"></i> : <i className="ph ph-square text-base"></i>}
                                                </button>
                                            </th>
                                            <th className="px-3 py-1.5 w-28 cursor-pointer hover:text-blue-600 transition-colors border-r border-slate-200" onClick={() => setSort({key:'date', dir: sort.dir==='asc'?'desc':'asc'})}>Date/Time</th>
                                            <th className="px-2 py-1.5 w-16 border-r border-slate-200 text-center">Type</th>
                                            <th className="px-3 py-1.5 text-right w-24 cursor-pointer hover:text-blue-600 border-r border-slate-200" onClick={() => setSort({key:'amt', dir: sort.dir==='asc'?'desc':'asc'})}>Amount</th>
                                            <th className="px-3 py-1.5 border-r border-slate-200">Description & Notes</th>
                                            <th className="px-3 py-1.5 w-36 cursor-pointer hover:text-blue-600 border-r border-slate-200" onClick={() => setSort({key:'cat', dir: sort.dir==='asc'?'desc':'asc'})}>Category</th>
                                            <th className="px-2 py-1.5 w-10"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-[10px] md:text-[11px]">
                                        {filtered.map(item => (
                                            <tr key={item.id} className={`hover:bg-blue-50/40 transition-colors group h-8 ${selected.has(item.id) ? 'bg-blue-50/60' : ''}`}>
                                                <td className="px-2 py-1 text-center border-r border-slate-50">
                                                    <button onClick={() => {
                                                        const next = new Set(selected);
                                                        if (next.has(item.id)) next.delete(item.id); else next.add(item.id);
                                                        setSelected(next);
                                                    }}>
                                                        {selected.has(item.id) ? <i className="ph ph-check-square text-[14px] text-blue-600"></i> : <i className="ph ph-square text-[14px] text-slate-200 group-hover:text-slate-400"></i>}
                                                    </button>
                                                </td>
                                                <td className="px-3 py-1 font-mono text-[10px] text-slate-500 whitespace-nowrap border-r border-slate-50">{item.date}</td>
                                                <td className="px-2 py-1 border-r border-slate-50 text-center">
                                                    <span className={`px-1 rounded text-[8px] font-black uppercase tracking-wider ${item.type === 'Income' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                        {item.type === 'Income' ? 'INC' : 'EXP'}
                                                    </span>
                                                </td>
                                                <td className={`px-3 py-1 text-right font-bold whitespace-nowrap border-r border-slate-50 ${item.type === 'Income' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                    ฿{(item.amt || 0).toLocaleString(undefined, {minimumFractionDigits:2})}
                                                </td>
                                                <td className="px-3 py-1 border-r border-slate-50 overflow-hidden relative" title={`${item.desc} ${item.note ? `| ${item.note}` : ''}`}>
                                                    <div className="font-medium text-slate-800 truncate whitespace-nowrap">
                                                        {item.desc} {item.note && <span className="text-slate-400 italic">| {item.note}</span>}
                                                    </div>
                                                </td>
                                                <td className="px-3 py-1 border-r border-slate-50 overflow-hidden">
                                                    <span className="bg-slate-100 px-1.5 py-0.5 rounded text-[9px] text-slate-600 font-bold uppercase truncate block w-full">{item.cat || 'General'}</span>
                                                </td>
                                                <td className="px-2 py-1 text-center opacity-0 group-hover:opacity-100">
                                                    <button onClick={() => {setEditId(item.id); setEditForm({...item})}} className="text-slate-400 hover:text-blue-600 transition-colors"><i className="ph ph-pencil-simple text-sm"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                
                                {filtered.length === 0 && !syncing && (
                                    <div className="py-20 text-center flex flex-col items-center gap-3 text-slate-300">
                                        <i className="ph ph-cloud text-5xl"></i>
                                        <div className="space-y-1">
                                            <p className="font-black uppercase tracking-[0.3em] text-xs text-slate-400">No Data Found</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB: REPORTS (With Visual Charts) */}
                        {activeTab === 'reports' && (
                            <div className="p-4 md:p-6 max-w-6xl mx-auto space-y-6">
                                
                                {/* Top Summary Charts */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* Monthly Trend Chart */}
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                                        <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><i className="ph ph-chart-bar text-blue-600"></i> Monthly Trend</h2>
                                        <div className="h-40 flex items-end gap-2 overflow-x-auto pb-2 border-b border-slate-100">
                                            {reportStats.monthly.map((stat, i) => (
                                                <div key={stat.label} className="flex flex-col justify-end items-center gap-1 flex-1 min-w-[30px]" title={`${stat.label}: Inc ฿${stat.inc} | Exp ฿${stat.exp}`}>
                                                    <div className="flex gap-0.5 items-end h-32 w-full justify-center">
                                                        <div style={{height: `${(stat.inc/reportStats.maxMonthVal)*100}%`}} className="w-1.5 md:w-3 bg-emerald-400 rounded-t-sm animate-grow-up"></div>
                                                        <div style={{height: `${(stat.exp/reportStats.maxMonthVal)*100}%`}} className="w-1.5 md:w-3 bg-rose-400 rounded-t-sm animate-grow-up" style={{animationDelay: '0.1s'}}></div>
                                                    </div>
                                                    <span className="text-[8px] font-bold text-slate-400 -rotate-45 origin-top-left mt-2">{stat.label.split('-')[1]}/{stat.label.split('-')[0].substring(2)}</span>
                                                </div>
                                            ))}
                                            {reportStats.monthly.length === 0 && <div className="w-full h-full flex items-center justify-center text-slate-300 text-xs">No data to chart</div>}
                                        </div>
                                    </div>

                                    {/* Top Expenses by Category Chart */}
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                                        <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><i className="ph ph-chart-pie-slice text-blue-600"></i> Top Expenses by Category</h2>
                                        <div className="h-40 overflow-y-auto space-y-3 pr-2">
                                            {reportStats.categories.slice(0, 8).map((cat, i) => (
                                                <div key={cat.label} className="flex items-center gap-2 text-[10px]">
                                                    <div className="w-24 truncate font-bold text-slate-600" title={cat.label}>{cat.label}</div>
                                                    <div className="flex-1 bg-slate-100 h-2 rounded-full overflow-hidden">
                                                        <div style={{width: `${(cat.exp/reportStats.maxCatExp)*100}%`, animationDelay: `${i*0.05}s`}} className="bg-rose-400 h-full rounded-full animate-grow-right"></div>
                                                    </div>
                                                    <div className="w-16 text-right font-mono text-slate-500">฿{cat.exp.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                                </div>
                                            ))}
                                            {reportStats.categories.length === 0 && <div className="w-full h-full flex items-center justify-center text-slate-300 text-xs">No data to chart</div>}
                                        </div>
                                    </div>
                                </div>

                                {/* Raw Data Tables */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
                                        <div className="bg-slate-50 p-2 border-b border-slate-100">
                                            <h2 className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Monthly Data</h2>
                                        </div>
                                        <div className="overflow-x-auto max-h-[400px] overflow-y-auto">
                                            <table className="w-full text-left border-collapse text-[10px]">
                                                <thead className="bg-white sticky top-0 border-b">
                                                    <tr className="text-slate-400 font-bold uppercase tracking-wider">
                                                        <th className="px-3 py-2">Month</th>
                                                        <th className="px-3 py-2 text-right">Income</th>
                                                        <th className="px-3 py-2 text-right">Expense</th>
                                                        <th className="px-3 py-2 text-right">Net</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {reportStats.monthly.map(stat => (
                                                        <tr key={stat.label} className="hover:bg-slate-50">
                                                            <td className="px-3 py-1.5 font-bold text-slate-600">{stat.label}</td>
                                                            <td className="px-3 py-1.5 text-right font-medium text-emerald-600">฿{stat.inc.toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                                                            <td className="px-3 py-1.5 text-right font-medium text-rose-600">฿{stat.exp.toLocaleString(undefined, {minimumFractionDigits:2})}</td>
                                                            <td className={`px-3 py-1.5 text-right font-black ${stat.inc - stat.exp >= 0 ? 'text-blue-600' : 'text-orange-600'}`}>
                                                                ฿{(stat.inc - stat.exp).toLocaleString(undefined, {minimumFractionDigits:2})}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
                                        <div className="bg-slate-50 p-2 border-b border-slate-100">
                                            <h2 className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Category Totals</h2>
                                        </div>
                                        <div className="overflow-x-auto max-h-[400px] overflow-y-auto">
                                            <table className="w-full text-left border-collapse text-[10px]">
                                                <thead className="bg-white sticky top-0 border-b">
                                                    <tr className="text-slate-400 font-bold uppercase tracking-wider">
                                                        <th className="px-3 py-2">Category</th>
                                                        <th className="px-3 py-2 text-right">Income</th>
                                                        <th className="px-3 py-2 text-right">Expense</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {reportStats.categories.map(stat => (
                                                        <tr key={stat.label} className="hover:bg-slate-50">
                                                            <td className="px-3 py-1.5 font-bold text-slate-600 truncate max-w-[120px]" title={stat.label}>{stat.label}</td>
                                                            <td className="px-3 py-1.5 text-right font-medium text-emerald-600">{stat.inc > 0 ? `฿${stat.inc.toLocaleString(undefined, {minimumFractionDigits:2})}` : '-'}</td>
                                                            <td className="px-3 py-1.5 text-right font-medium text-rose-600">{stat.exp > 0 ? `฿${stat.exp.toLocaleString(undefined, {minimumFractionDigits:2})}` : '-'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Global Status Footer */}
                    <footer className="bg-white border-t flex flex-col md:flex-row items-center justify-between px-3 py-1 md:h-6 shrink-0 z-30 shadow-2xl gap-1">
                        <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                            <div className="flex items-center gap-1.5">
                                {dbStatus === 'blocked' ? <i className="ph ph-warning-circle text-red-500 text-[10px]"></i> : <div className={`w-1.5 h-1.5 rounded-full ${user && dbStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}`}></div>}
                                <span className={`text-[8px] font-black uppercase tracking-widest ${dbStatus === 'blocked' ? 'text-red-500' : 'text-slate-500'}`}>{dbStatus === 'blocked' ? 'DB BLOCKED' : user ? 'Stable' : 'Offline'}</span>
                            </div>
                            <span className="text-[8px] text-slate-400 font-bold uppercase tracking-widest hidden md:inline">Path: /artifacts/{appId}/public/data/ledger</span>
                            <div className="flex items-center gap-2 md:ml-auto">
                                {syncing && <span className="text-blue-600 font-black text-[8px] animate-pulse flex items-center gap-1"><i className="ph ph-arrows-clockwise animate-spin"></i> SYNC</span>}
                                <span className="text-[8px] text-slate-900 font-black tracking-tighter uppercase">Records: {ledger.length.toLocaleString()}</span>
                            </div>
                        </div>
                    </footer>

                    {/* CATEGORY MANAGER MODAL (Updated with "To Desc & Select" Dropdown) */}
                    {showCategoryManager && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center p-2 md:p-4 animate-in fade-in">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl flex flex-col max-h-[90vh] animate-in zoom-in-95">
                                <div className="flex justify-between items-center p-4 border-b bg-slate-50 rounded-t-xl">
                                    <h3 className="font-black uppercase tracking-widest text-slate-900 text-sm flex items-center gap-2"><i className="ph ph-folders text-blue-600 text-lg"></i> Manage Categories</h3>
                                    <button onClick={() => setShowCategoryManager(false)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 p-1.5 rounded-md transition-colors"><i className="ph ph-x"></i></button>
                                </div>
                                <div className="p-0 overflow-y-auto flex-1">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-white sticky top-0 border-b z-10 shadow-sm">
                                            <tr className="text-[9px] text-slate-400 uppercase tracking-widest">
                                                <th className="p-3 border-r">Category Name</th>
                                                <th className="p-3 border-r text-center w-16">Uses</th>
                                                <th className="p-3 text-right w-48">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-[11px] divide-y">
                                            {allCategoryStats.map(stat => (
                                                <tr key={stat.label} className="hover:bg-blue-50/50 transition-colors">
                                                    <td className="p-2 md:p-3 font-bold text-slate-700 border-r truncate max-w-[150px]">{stat.label}</td>
                                                    <td className="p-2 md:p-3 text-slate-500 font-medium text-center border-r">{stat.count}</td>
                                                    <td className="p-2 md:p-3 text-right flex justify-end gap-1">
                                                        <button 
                                                            onClick={() => {
                                                                setDialog({
                                                                    type: 'select',
                                                                    options: MAIN_CATEGORIES,
                                                                    inputValue: 'General',
                                                                    title: 'Move to Description & Re-Categorize',
                                                                    message: `Append text "[Cat: ${stat.label}]" to the description of all ${stat.count} items, and assign them to a new category:`,
                                                                    confirmText: 'Move & Update',
                                                                    onConfirm: async (selectedCat) => {
                                                                        if (!selectedCat) return;
                                                                        setSyncing(true);
                                                                        try {
                                                                            const CHUNK = 400;
                                                                            const idsToUpdate = ledger.filter(tx => (tx.cat || 'General') === stat.label);
                                                                            const colRef = getLedgerRef();
                                                                            for (let i = 0; i < idsToUpdate.length; i += CHUNK) {
                                                                                const batch = db.batch();
                                                                                idsToUpdate.slice(i, i + CHUNK).forEach(tx => {
                                                                                    const newDesc = `${tx.desc} [Cat: ${stat.label}]`.trim();
                                                                                    batch.set(colRef.doc(tx.id), { cat: selectedCat, desc: newDesc }, { merge: true });
