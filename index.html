                                                                                });
                                                                                await batch.commit();
                                                                            }
                                                                            setStatusMsg({ type: 'success', text: `Moved '${stat.label}' to desc and updated ${idsToUpdate.length} items to '${selectedCat}'.` });
                                                                        } catch (err) {
                                                                            setStatusMsg({ type: 'error', text: `Update failed: ${err.message}` });
                                                                        }
                                                                        setSyncing(false);
                                                                    }
                                                                });
                                                            }} 
                                                            className="text-[9px] text-amber-600 hover:text-white font-bold bg-amber-50 hover:bg-amber-500 px-2 py-1.5 rounded-md transition-colors shadow-sm"
                                                            title="Move category text into description and assign a new main category"
                                                        >To Desc</button>
                                                        <button 
                                                            onClick={() => {
                                                                setDialog({
                                                                    type: 'prompt',
                                                                    list: 'main-categories',
                                                                    title: 'Rename / Merge Category',
                                                                    message: `Rename all ${stat.count} items in '${stat.label}' to a new category. If the name already exists, they will merge.`,
                                                                    inputValue: stat.label,
                                                                    confirmText: 'Rename',
                                                                    onConfirm: async (newCat) => {
                                                                        if (!newCat || !newCat.trim() || stat.label === newCat.trim()) return;
                                                                        setSyncing(true);
                                                                        try {
                                                                            const CHUNK = 400;
                                                                            const idsToUpdate = ledger.filter(tx => (tx.cat || 'General') === stat.label).map(tx => tx.id);
                                                                            const colRef = getLedgerRef();
                                                                            for (let i = 0; i < idsToUpdate.length; i += CHUNK) {
                                                                                const batch = db.batch();
                                                                                idsToUpdate.slice(i, i + CHUNK).forEach(id => {
                                                                                    batch.set(colRef.doc(id), { cat: newCat.trim() }, { merge: true });
                                                                                });
                                                                                await batch.commit();
                                                                            }
                                                                            setStatusMsg({ type: 'success', text: `Merged '${stat.label}' into '${newCat.trim()}'.` });
                                                                        } catch (err) {
                                                                            setStatusMsg({ type: 'error', text: `Update failed: ${err.message}` });
                                                                        }
                                                                        setSyncing(false);
                                                                    }
                                                                });
                                                            }} 
                                                            className="text-[9px] text-blue-600 hover:text-white font-bold bg-blue-50 hover:bg-blue-600 px-2 py-1.5 rounded-md transition-colors shadow-sm"
                                                        >Rename</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editId && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center border-b p-4 bg-slate-50">
                                    <h3 className="font-black uppercase tracking-widest text-slate-900 text-base flex items-center gap-2"><i className="ph ph-pencil-simple text-blue-600"></i> Edit Record</h3>
                                    <button onClick={() => setEditId(null)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 p-1.5 rounded-md transition-colors"><i className="ph ph-x"></i></button>
                                </div>
                                
                                <div className="p-5 space-y-4 overflow-y-auto max-h-[60vh]">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Date / Time</label>
                                            <input className="w-full border border-slate-200 rounded-lg p-2 text-xs font-black focus:border-blue-500 outline-none transition-all shadow-inner" type="text" value={editForm.date || ''} onChange={e => setEditForm({...editForm, date: e.target.value})}/>
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Amount (฿)</label>
                                            <input className="w-full border border-slate-200 rounded-lg p-2 text-xs font-black focus:border-blue-500 outline-none transition-all shadow-inner" type="number" step="0.01" value={editForm.amt || ''} onChange={e => setEditForm({...editForm, amt: parseCurrency(e.target.value)})}/>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Category</label>
                                        <input 
                                            list="main-categories"
                                            className="w-full border border-slate-200 rounded-lg p-2 text-xs font-black focus:border-blue-500 outline-none transition-all shadow-inner bg-white" 
                                            value={editForm.cat || ''} 
                                            onChange={e => setEditForm({...editForm, cat: e.target.value})}
                                        />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Description & Notes</label>
                                        <textarea className="w-full border border-slate-200 rounded-lg p-2 text-xs font-medium focus:border-blue-500 outline-none transition-all shadow-inner" rows={3} value={editForm.desc || ''} onChange={e => setEditForm({...editForm, desc: e.target.value})}/>
                                    </div>
                                </div>

                                <div className="p-4 border-t bg-slate-50 flex gap-2">
                                    <button onClick={() => triggerDelete([editId])} className="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 font-black rounded-lg transition-all shadow-sm"><i className="ph ph-trash text-base"></i></button>
                                    <button onClick={async () => {
                                        setSyncing(true);
                                        try {
                                            const updateData = {
                                                date: editForm.date,
                                                amt: editForm.amt,
                                                cat: editForm.cat,
                                                desc: editForm.desc
                                            };
                                            await getLedgerRef().doc(editId).set(updateData, { merge: true });
                                            setEditId(null);
                                            setStatusMsg({ type: 'success', text: "Record updated." });
                                        } catch (e) { 
                                            setStatusMsg({ type: 'error', text: `Save failed: ${e.message}` }); 
                                        }
                                        setSyncing(false);
                                    }} className="flex-1 bg-blue-600 text-white font-black py-2 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition-all uppercase tracking-widest flex justify-center items-center gap-1.5">
                                        <i className="ph ph-floppy-disk text-base"></i> Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Global Confirmation / Prompt Modal */}
                    {dialog && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[120] flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm space-y-4 animate-in zoom-in-95 duration-200">
                                <h3 className="font-black uppercase tracking-widest text-slate-900 text-sm">{dialog.title}</h3>
                                <p className="text-xs font-medium text-slate-600 leading-relaxed">{dialog.message}</p>
                                
                                {dialog.type === 'prompt' && (
                                    <input 
                                        autoFocus 
                                        list={dialog.list}
                                        className="w-full border border-slate-200 rounded-lg p-2 text-xs font-black focus:border-blue-500 outline-none transition-all mt-2 shadow-inner bg-white" 
                                        value={dialog.inputValue || ''} 
                                        onChange={e => setDialog({...dialog, inputValue: e.target.value})} 
                                        placeholder="Enter value..." 
                                    />
                                )}

                                {dialog.type === 'select' && (
                                    <select 
                                        autoFocus 
                                        className="w-full border border-slate-200 rounded-lg p-2 text-xs font-black focus:border-blue-500 outline-none transition-all mt-2 shadow-inner bg-white" 
                                        value={dialog.inputValue || ''} 
                                        onChange={e => setDialog({...dialog, inputValue: e.target.value})} 
                                    >
                                        {dialog.options.map(opt => (
                                            <option key={opt} value={opt}>{opt}</option>
                                        ))}
                                    </select>
                                )}

                                <div className="flex gap-2 pt-3 border-t mt-3">
                                    <button onClick={() => setDialog(null)} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-600 text-xs transition-colors">Cancel</button>
                                    <button 
                                        onClick={() => { 
                                            dialog.onConfirm(dialog.inputValue); 
                                            setDialog(null); 
                                        }} 
                                        className={`flex-1 py-2 text-white rounded-lg font-bold shadow-md transition-all text-xs ${dialog.danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {dialog.confirmText || 'Confirm'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
        <script src="https://loren-6q.github.io/WETNav/nav.js"></script>
</body>
</html>
